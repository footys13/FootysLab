<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical Board — The Footys</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d1117;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: auto;
    user-select: none;
  }

  /* ── HEADER ── */
  #header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    flex-shrink: 0;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  #header .toolgroup { flex-shrink: 0; }
  #header .brand {
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 2px;
    color: #ffffff;
    text-transform: uppercase;
  }
  .sep { width: 1px; height: 24px; background: #30363d; }

  /* ── TOOLGROUPS ── */
  .toolgroup { display: flex; gap: 6px; align-items: center; }
  .tool-label {
    font-size: 10px; color: #8b949e;
    text-transform: uppercase; letter-spacing: 1px; padding-right: 4px;
  }

  /* ── BUTTONS ── */
  .btn {
    background: #21262d; border: 1px solid #30363d;
    color: #c9d1d9; border-radius: 6px; padding: 5px 10px;
    font-size: 13px; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .btn:hover { background: #30363d; border-color: #58a6ff; }
  .btn.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }
  .btn svg { width: 14px; height: 14px; }

  /* ── COLOR PICKER ── */
  .color-swatch {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #30363d; cursor: pointer;
    transition: transform .15s, border-color .15s;
  }
  .color-swatch:hover, .color-swatch.active { transform: scale(1.2); border-color: #fff; }

  input[type=color] {
    width: 28px; height: 28px; border: 1px solid #30363d;
    border-radius: 6px; background: #21262d; cursor: pointer; padding: 2px;
  }
  input[type=range] {
    -webkit-appearance: none; width: 70px; height: 4px;
    border-radius: 2px; background: #30363d; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #58a6ff;
  }

  /* ── PITCH ── */
  #pitch-wrap {
    flex: 1; display: flex; justify-content: center;
    align-items: flex-start; overflow: auto; padding: 16px;
    -webkit-overflow-scrolling: touch;
  }
  #pitch-container { position: relative; touch-action: none; flex-shrink: 0; }
  #pitch-svg { display: block; border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  #bg-layer {
    position: absolute; top: 0; left: 0; overflow: hidden;
    border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,.6);
    background: #000; display: none;
    /* Fix: ensure bg-layer always fills the pitch container exactly */
    width: 100%; height: 100%;
  }
  #bg-layer.visible { display: block; }
  #bg-img, #bg-video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #annotation-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  #annotation-canvas.drawing { pointer-events: all; }
  #player-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #player-layer.editable { pointer-events: all; }

  /* ── PLAYER TOKEN ── */
  .player-token {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; pointer-events: all;
  }
  .player-token.dragging { opacity: .85; z-index: 999; cursor: grabbing; }

  /* ── BALL TOKEN ── */
  #ball-token {
    position: absolute; transform: translate(-50%, -50%);
    width: 32px; height: 32px; cursor: grab; pointer-events: all;
    z-index: 50; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6));
    transition: filter .1s;
  }
  #ball-token:hover { filter: drop-shadow(0 0 10px rgba(255,220,100,.5)) drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
  #ball-token.dragging { cursor: grabbing; filter: drop-shadow(0 0 12px rgba(255,220,100,.7)) drop-shadow(0 4px 8px rgba(0,0,0,.7)); z-index: 999; }
  .player-circle {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.9);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.5); position: relative; z-index: 1;
    transition: transform .15s, box-shadow .15s;
  }
  .player-token:hover .player-circle { transform: scale(1.05); }
  .player-circle.selected { box-shadow: 0 0 0 3px #fff, 0 0 14px 4px rgba(88,166,255,.65), 0 2px 8px rgba(0,0,0,.5); }
  .player-label {
    margin-top: 3px; background: rgba(0,0,0,.88); color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    padding: 2px 8px; border-radius: 3px; white-space: nowrap;
    text-transform: uppercase; pointer-events: none;
  }
  .player-label:empty { display: none; }

  /* ── PLAYER EDITOR ── */
  #player-editor {
    position: fixed; right: 16px; top: 60px;
    background: #161b22; border: 1px solid #30363d;
    border-radius: 10px; padding: 14px; width: 220px;
    z-index: 500; display: none; flex-direction: column; gap: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  #player-editor.visible { display: flex; }
  #player-editor h3 { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
  #player-editor input[type=text] {
    width: 100%; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; color: #e6edf3; padding: 6px 8px; font-size: 13px;
  }
  #player-editor input[type=text]:focus { outline: none; border-color: #58a6ff; }
  .color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .color-grid .color-swatch { width: 24px; height: 24px; }

  /* ── CONTEXT MENU ── */
  #ctx-menu {
    position: fixed; background: #21262d; border: 1px solid #30363d;
    border-radius: 8px; padding: 4px; z-index: 1000; display: none;
    flex-direction: column; gap: 2px; box-shadow: 0 8px 24px rgba(0,0,0,.6); min-width: 140px;
  }
  #ctx-menu.visible { display: flex; }
  #ctx-menu button {
    background: none; border: none; color: #c9d1d9;
    padding: 7px 12px; font-size: 12px; border-radius: 5px;
    cursor: pointer; text-align: left;
  }
  #ctx-menu button:hover { background: #30363d; }
  #ctx-menu button.danger { color: #f85149; }

  /* ── TEMPLATE MODAL ── */
  #tpl-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    z-index: 2000; display: none; align-items: center; justify-content: center;
  }
  #tpl-modal.visible { display: flex; }
  #tpl-box {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 12px; padding: 20px; width: 340px;
    max-height: 80vh; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 16px 48px rgba(0,0,0,.8);
  }
  #tpl-box h2 { font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
  #tpl-name-input {
    width: 100%; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; color: #e6edf3; padding: 8px 10px; font-size: 13px;
  }
  #tpl-name-input:focus { outline: none; border-color: #58a6ff; }
  #tpl-list {
    overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px;
    max-height: 300px;
  }
  .tpl-item {
    display: flex; align-items: center; gap: 8px;
    background: #21262d; border: 1px solid #30363d;
    border-radius: 8px; padding: 8px 10px; cursor: pointer;
    transition: border-color .15s;
  }
  .tpl-item:hover { border-color: #58a6ff; }
  .tpl-item-name { flex: 1; font-size: 13px; font-weight: 600; }
  .tpl-item-meta { font-size: 10px; color: #8b949e; }
  .tpl-item-del {
    background: none; border: none; color: #f85149;
    cursor: pointer; padding: 2px 6px; font-size: 14px; border-radius: 4px;
  }
  .tpl-item-del:hover { background: rgba(248,81,73,.15); }
  .tpl-actions { display: flex; gap: 8px; }
  .tpl-actions .btn { flex: 1; justify-content: center; }
  .tpl-empty { color: #6b7280; font-size: 12px; text-align: center; padding: 16px 0; }

  /* ── STATUS ── */
  #status {
    font-size: 12px; color: #8b949e;
    padding: 4px 16px; background: #161b22;
    border-top: 1px solid #30363d; flex-shrink: 0;
  }

  /* ── VIDEO CONTROL BAR ── */
  #video-bar {
    display: none; align-items: center; gap: 10px;
    padding: 6px 16px; background: #161b22;
    border-bottom: 1px solid #30363d; flex-shrink: 0;
  }
  #video-bar.visible { display: flex; }
  #video-bar input[type=range] { flex: 1; width: auto; }
  #video-time { font-size: 11px; color: #8b949e; min-width: 90px; text-align: center; }
  #gif-progress {
    font-size: 11px; color: #58a6ff; min-width: 120px;
  }

  /* ── KEYFRAME TIMELINE ── */
  #anim-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 16px; background: #10151c;
    border-bottom: 1px solid #30363d; flex-shrink: 0;
  }
  #kf-count { font-size: 11px; color: #8b949e; white-space: nowrap; }
  #kf-track { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding: 2px 0; -webkit-overflow-scrolling: touch; }
  .kf-item {
    display: flex; align-items: center; gap: 5px;
    background: #21262d; border: 1px solid #30363d;
    border-radius: 6px; padding: 4px 6px; cursor: pointer;
    flex-shrink: 0; transition: border-color .15s, background .15s;
  }
  .kf-item:hover { border-color: #58a6ff; }
  .kf-item.active { border-color: #58a6ff; background: rgba(31,111,235,.18); }
  .kf-item .kf-num {
    font-size: 11px; font-weight: 700; color: #c9d1d9;
    width: 16px; text-align: center; flex-shrink: 0;
  }
  .kf-item input[type=number] {
    width: 46px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 4px; color: #e6edf3; font-size: 11px; padding: 2px 4px;
  }
  .kf-del {
    background: none; border: none; color: #f85149;
    cursor: pointer; font-size: 12px; padding: 0 2px; line-height: 1;
  }
  .kf-del:hover { color: #ff7b72; }
  #anim-seek { flex-shrink: 0; width: 130px; }

  /* cursor styles per tool mode */
  #annotation-canvas.drawing.mode-crosshair { cursor: crosshair; }
  #annotation-canvas.drawing.mode-pen       { cursor: cell; }
  #annotation-canvas.mode-select-ann { cursor: default; }
  #annotation-canvas.mode-select-ann.hovering { cursor: move; }
  #annotation-canvas.mode-boxselect { cursor: crosshair; }
</style>
</head>
<body>

<!-- ── HEADER TOOLBAR ── -->
<div id="header">
  <span class="brand">The Footys</span>
  <div class="sep"></div>

  <div class="toolgroup">
    <span class="tool-label">Mode</span>
    <button class="btn active" id="tool-select" onclick="setTool('select')" title="Select & Move">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2l10 6-5 1-2 5z"/></svg>
      Select
    </button>
    <button class="btn" id="tool-boxselect" onclick="setTool('boxselect')" title="Box Select — drag to select multiple (tablet-friendly)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,2"><rect x="2" y="2" width="12" height="12" rx="1"/><line x1="7" y1="2" x2="7" y2="14" stroke-width="0.5"/><line x1="2" y1="7" x2="14" y2="7" stroke-width="0.5"/></svg>
      Box
    </button>
    <button class="btn" id="tool-player" onclick="setTool('player')" title="Add Player">
      <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
      Player
    </button>
    <button class="btn" id="tool-ball" onclick="setTool('ball')" title="Toggle Ball Visibility">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="8" cy="8" r="6"/><path d="M8 2 Q10 5 8 8 Q6 11 8 14M2 6h12M2 10h12"/></svg>
      Ball
    </button>
  </div>

  <div class="sep"></div>

  <!-- ANNOTATION TOOLS — all pin-point based -->
  <div class="toolgroup">
    <span class="tool-label">Draw</span>
    <button class="btn" id="tool-arrow" onclick="setTool('arrow')" title="Arrow: click start → click end">
      <svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5" fill="none"><line x1="2" y1="14" x2="12" y2="4"/><polyline points="7,4 12,4 12,9"/></svg>
      Arrow
    </button>
    <button class="btn" id="tool-line" onclick="setTool('line')" title="Line: click start → click end">
      <svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5" fill="none"><line x1="2" y1="14" x2="14" y2="2"/></svg>
      Line
    </button>
    <button class="btn" id="tool-curve" onclick="setTool('curve')" title="Curve: click start → click end → click control">
      <svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M2 14 Q8 2 14 8"/><polyline points="10,5 14,8 11,11"/></svg>
      Curve
    </button>
    <button class="btn" id="tool-ellipse" onclick="setTool('ellipse')" title="Ellipse: click center → click edge">
      <svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5" fill="none"><ellipse cx="8" cy="8" rx="6" ry="4"/></svg>
      Ellipse
    </button>
    <button class="btn" id="tool-rect" onclick="setTool('rect')" title="Rect: click corner → click opposite corner">
      <svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5" fill="none"><rect x="2" y="4" width="12" height="8" rx="1"/></svg>
      Rect
    </button>
    <button class="btn" id="tool-polygon" onclick="setTool('polygon')" title="Polygon: click points, click first or double-click to close">
      <svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5" fill="none"><polygon points="8,2 14,6 12,13 4,13 2,6"/></svg>
      Polygon
    </button>
  </div>

  <div class="sep"></div>

  <!-- STYLE -->
  <div class="toolgroup">
    <span class="tool-label">Color</span>
    <div class="color-swatch active" style="background:#ffffff" data-color="#ffffff" onclick="setColor(this)" title="White"></div>
    <div class="color-swatch" style="background:#f85149" data-color="#f85149" onclick="setColor(this)" title="Red"></div>
    <div class="color-swatch" style="background:#ffa657" data-color="#ffa657" onclick="setColor(this)" title="Orange"></div>
    <div class="color-swatch" style="background:#3fb950" data-color="#3fb950" onclick="setColor(this)" title="Green"></div>
    <div class="color-swatch" style="background:#58a6ff" data-color="#58a6ff" onclick="setColor(this)" title="Blue"></div>
    <div class="color-swatch" style="background:#d2a8ff" data-color="#d2a8ff" onclick="setColor(this)" title="Purple"></div>
    <div class="color-swatch" style="background:#f9e157" data-color="#f9e157" onclick="setColor(this)" title="Yellow"></div>
    <input type="color" id="custom-color" value="#ffffff" onchange="setColorFromPicker(this.value)" title="Custom color">
  </div>

  <div class="toolgroup">
    <span class="tool-label">Size</span>
    <input type="range" id="stroke-size" min="1" max="8" value="2" oninput="strokeSize=+this.value">
  </div>

  <div class="toolgroup">
    <span class="tool-label">Style</span>
    <button class="btn active" id="stroke-solid" onclick="setDash('solid')" title="Solid">—</button>
    <button class="btn" id="stroke-dash" onclick="setDash('dash')" title="Dashed">- -</button>
  </div>

  <div class="sep"></div>

  <!-- ACTIONS -->
  <div class="toolgroup">
    <button class="btn" id="btn-undo" onclick="undo()" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4H10a4 4 0 010 8H4"/><polyline points="7,1 4,4 7,7"/></svg>
      Undo
    </button>
    <button class="btn" id="btn-redo" onclick="redo()" title="Redo (Ctrl+Shift+Z / Ctrl+Y)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4H6a4 4 0 000 8h6"/><polyline points="9,1 12,4 9,7"/></svg>
      Redo
    </button>
    <button class="btn" onclick="clearAnnotations()" title="Clear drawings">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>
      Clear
    </button>
    <button class="btn" onclick="exportPNG()" title="Export PNG">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 11v3h10v-3M8 2v8M5 7l3 3 3-3"/></svg>
      Export
    </button>
    <button class="btn" onclick="openTemplateModal()" title="Save / Load template">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 2v5h6V2M5 10h6"/></svg>
      Templates
    </button>
  </div>

  <!-- FORMATION -->
  <div class="toolgroup">
    <span class="tool-label">Formation</span>
    <select id="formation-select" onchange="loadFormation(this.value)" style="background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer">
      <option value="">— Load —</option>
      <option value="433">4-3-3</option>
      <option value="442">4-4-2</option>
      <option value="352">3-5-2</option>
      <option value="4231">4-2-3-1</option>
      <option value="325">3-2-5 (Box3)</option>
    </select>
    <button class="btn" onclick="loadMonoFormation('own')" title="Add 11 own-team players in one colour, using the formation shape above" style="border-color:#1f6feb">
      <span style="width:9px;height:9px;border-radius:50%;background:#1f6feb;display:inline-block"></span>
      My XI
    </button>
    <button class="btn" onclick="loadMonoFormation('opp')" title="Add 11 opponent players in one colour, mirrored to face your team" style="border-color:#da3633">
      <span style="width:9px;height:9px;border-radius:50%;background:#da3633;display:inline-block"></span>
      Opponent XI
    </button>
  </div>

  <div class="sep"></div>

  <!-- ANIMATION -->
  <div class="toolgroup">
    <span class="tool-label">Animate</span>
    <button class="btn" onclick="addKeyframe()" title="Capture current player/ball positions as a new keyframe">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
      + Keyframe
    </button>
    <button class="btn" onclick="updateActiveKeyframe()" title="Overwrite the selected keyframe with current positions">Update</button>
    <button class="btn" id="btn-anim-play" onclick="toggleAnimPlay()" title="Play / Pause animation (Space)">▶ Play</button>
    <button class="btn" onclick="recordAnimationVideo()" title="Play the full animation and export it as a high-quality video">
      <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="5"/></svg>
      Export Animation
    </button>
  </div>

  <div class="sep"></div>

  <!-- MEDIA BACKGROUND -->
  <div class="toolgroup">
    <span class="tool-label">Media</span>
    <input type="file" id="media-input" accept="image/*,video/*" style="display:none" onchange="handleMediaUpload(this.files[0])">
    <button class="btn" onclick="document.getElementById('media-input').click()" title="Upload photo or video as background">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 11V2M4 6l4-4 4 4"/><path d="M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2"/></svg>
      Upload
    </button>
    <button class="btn" id="btn-use-pitch" onclick="setMediaMode('pitch')" title="Switch back to soccer pitch">
      Use Pitch
    </button>
    <button class="btn" onclick="toggleRecording()" id="btn-record" title="Record everything you do (play/pause/draw) then save as video">
      <svg viewBox="0 0 16 16" fill="currentColor" id="icon-record"><circle cx="8" cy="8" r="5"/></svg>
      Record
    </button>
    <span id="gif-progress"></span>
  </div>
</div>

<!-- ── VIDEO CONTROL BAR ── -->
<div id="video-bar">
  <button class="btn" id="btn-video-play" onclick="toggleVideoPlay()" title="Play / Pause">
    <svg viewBox="0 0 16 16" fill="currentColor" id="icon-play"><polygon points="3,2 14,8 3,14"/></svg>
  </button>
  <button class="btn" onclick="restartVideo()" title="Restart">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 1 1 1.8 4.2"/><polyline points="2,12 2,8 6,8"/></svg>
  </button>
  <input type="range" id="video-seek" min="0" max="1000" value="0" oninput="seekVideo(this.value)">
  <span id="video-time">0:00 / 0:00</span>
  <button class="btn" id="btn-video-mute" onclick="toggleVideoMute()" title="Mute / Unmute">🔊</button>
</div>

<!-- ── KEYFRAME ANIMATION TIMELINE ── -->
<div id="anim-bar">
  <span id="kf-count">0 keyframes</span>
  <div id="kf-track"></div>
  <input type="range" id="anim-seek" min="0" max="1000" value="0" oninput="seekAnimation(this.value)" title="Scrub animation">
</div>

<!-- ── PITCH ── -->
